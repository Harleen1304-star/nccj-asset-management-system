<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Tracking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-white to-indigo-200">

        <div class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-lg text-center">

            <!-- Icon -->
            <div class="flex justify-center mb-6">
                <div class="bg-blue-100 p-5 rounded-full">

                         fill="none"
                         viewBox="0 0 24 24"

            <br>

            <!-- Login Button -->

               class="inline-block bg-blue-600 hover:bg-blue-700 transition duration-300 text-white font-semibold px-8 py-3 rounded-lg shadow-lg">
