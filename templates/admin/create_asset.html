<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Asset</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gradient-to-br from-blue-100 via-white to-indigo-200">


<div class="min-h-screen flex">


    <!-- Sidebar -->

    <aside class="hidden md:flex flex-col w-64 bg-white shadow-xl p-6">


        <div class="flex items-center mb-10">


            <img 
                src="{{ url_for('static', filename='images/Logo_NCCJ.png') }}"
                alt="NCCJ Logo"
                class="w-12 h-12 object-contain rounded-lg">


        </div>




        <nav class="space-y-4">


            <a href="/admin/dashboard"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                🏠 Dashboard

            </a>




            <a href="/admin/assets"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                💻 Assets

            </a>




            <a href="/admin/create_asset"
               class="block bg-blue-100 text-blue-700 px-4 py-3 rounded-lg font-semibold">

                ➕ Create Asset

            </a>




            <a href="/admin/assign_asset"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                🔄 Assign Asset

            </a>




            <a href="/admin/requests"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                📋 Requests

            </a>




            <a href="/logout"
               class="block text-red-600 hover:bg-red-100 px-4 py-3 rounded-lg">

                🚪 Logout

            </a>


        </nav>


    </aside>







    <!-- Main Content -->


    <main class="flex-1 p-8">



        <!-- Header -->


        <div class="mb-8">


            <h1 class="text-4xl font-bold text-gray-800">

                Create New Asset

            </h1>

        </div>






        <!-- Form Card -->


        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-2xl">


            <form method="POST" class="space-y-6">





                <!-- Asset Tag -->


                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">

                        Asset Tag

                    </label>


                    <input

                        name="asset_tag"

                        placeholder="Laptop-001"

                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none"

                        required>

                </div>







                <!-- Asset Name -->


                <div>


                    <label class="block text-sm font-semibold text-gray-700 mb-2">

                        Asset Name

                    </label>



                    <input

                        name="asset_name"

                        placeholder="Dell Laptop"

                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none"

                        required>


                </div>







                <!-- Funder -->


                <div>


                    <label class="block text-sm font-semibold text-gray-700 mb-2">

                        Funder

                    </label>



                    <input

                        name="funder"

                        placeholder="NCCJ"

                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none">


                </div>







                <!-- Status -->


                <div>


                    <label class="block text-sm font-semibold text-gray-700 mb-2">

                        Status

                    </label>




                    <select

                        name="status"

                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none">



                        <option value="Available">
                            Available
                        </option>



                        <option value="Assigned">
                            Assigned
                        </option>



                        <option value="Repair">
                            Repair
                        </option>



                    </select>


                </div>








                <!-- Button -->


                <button

                    type="submit"

                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg shadow-lg font-semibold transition">


                    Create Asset


                </button>




            </form>



        </div>




    </main>


</div>


</body>

</html>
