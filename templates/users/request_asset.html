<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Asset</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gradient-to-br from-blue-100 via-white to-indigo-200">


<div class="min-h-screen flex">


    <!-- Sidebar -->

    <aside class="hidden md:flex flex-col w-64 bg-white shadow-xl p-6">


        <div class="flex items-center mb-10">
                <img src="{{ url_for('static', filename='images/Logo_NCCJ.png') }}" alt="NCCJ Logo" class="w-12 h-12 object-contain rounded-lg">
        </div>



        <nav class="space-y-4">


            <a href="/user/dashboard"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                🏠 Dashboard

            </a>



            <a href="/user/my_assets"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                💻 My Assets

            </a>



            <a href="/user/request_asset"
               class="block bg-blue-100 text-blue-700 px-4 py-3 rounded-lg font-semibold">

                📦 Request Asset

            </a>


            <a href="/user/notifications"
               class="block text-gray-600 hover:bg-gray-100 px-4 py-3 rounded-lg">

                🔔 Notifications

            </a>



            <a href="/logout"
               class="block text-red-600 hover:bg-red-100 px-4 py-3 rounded-lg">

                🚪 Logout

            </a>


        </nav>


    </aside>




    <!-- Main Content -->


    <main class="flex-1 p-8">



        <!-- Header -->


        <div class="mb-8">


            <h1 class="text-4xl font-bold text-gray-800">

                Request Asset

            </h1>

        </div>





        <!-- Request Form Card -->


        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-2xl">


            <form method="POST" class="space-y-6">



                <!-- Asset Selection -->


                <div>


                    <label class="block text-sm font-semibold text-gray-700 mb-2">

                        Select Asset

                    </label>



                    <select

                        name="asset_id"

                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none"

                        required>



                        {% if assets %}


                            {% for asset in assets %}


                            <option value="{{asset.asset_id}}">

                                {{asset.asset_tag}} - {{asset.asset_name}}

                            </option>


                            {% endfor %}


                        {% else %}


                            <option disabled selected>

                                No available assets

                            </option>


                        {% endif %}



                    </select>


                </div>





                <!-- Reason -->


                <div>


                    <label class="block text-sm font-semibold text-gray-700 mb-2">

                        Reason for Request

                    </label>



                    <textarea

                        name="reason"

                        rows="5"

                        placeholder="Explain why you need this asset..."

                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none resize-none"

                        required></textarea>


                </div>






                <!-- Submit Button -->


                <button

                    type="submit"

                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-semibold shadow-lg transition">


                    Submit Request


                </button>



            </form>



        </div>





    </main>


</div>


</body>

</html>
